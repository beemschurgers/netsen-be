<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Network Traffic Monitor</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #1a1a1a;
            color: #ffffff;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: #2a2a2a;
            border-radius: 8px;
            padding: 20px;
            border-left: 4px solid #00ff88;
        }
        .stat-value {
            font-size: 2em;
            font-weight: bold;
            color: #00ff88;
        }
        .stat-label {
            color: #cccccc;
            margin-top: 5px;
        }
        .traffic-table {
            background: #2a2a2a;
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 20px;
        }
        .table-header {
            background: #333333;
            padding: 15px;
            font-weight: bold;
        }
        .table-content {
            max-height: 400px;
            overflow-y: auto;
        }
        .traffic-row {
            padding: 10px 15px;
            border-bottom: 1px solid #333333;
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 1fr 1fr 1fr;
            gap: 10px;
        }
        .traffic-row:hover {
            background: #333333;
        }
        .protocol-tcp { color: #00ff88; }
        .protocol-udp { color: #ffaa00; }
        .protocol-icmp { color: #ff6666; }
        .status {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 10px 20px;
            border-radius: 5px;
            font-weight: bold;
        }
        .status.connected {
            background: #00ff88;
            color: #000000;
        }
        .status.disconnected {
            background: #ff6666;
            color: #ffffff;
        }
        .top-talkers {
            background: #2a2a2a;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .talker-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #333333;
        }
    </style>
</head>
<body>
    <div id="status" class="status disconnected">Disconnected</div>

    <div class="container">
        <div class="header">
            <h1>Network Traffic Monitor</h1>
            <p>Real-time packet capture and analysis</p>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-value" id="totalBandwidth">0.0</div>
                <div class="stat-label">Total Bandwidth (MB)</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="currentBandwidth">0.0</div>
                <div class="stat-label">Current Bandwidth (Mbps)</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="totalConnections">0</div>
                <div class="stat-label">Total Connections</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="activeConnections">0</div>
                <div class="stat-label">Active Connections</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="networkHealth">100</div>
                <div class="stat-label">Network Health Score</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="peakBandwidth">0.0</div>
                <div class="stat-label">Peak Bandwidth (MB)</div>
            </div>
        </div>

        <div class="top-talkers">
            <h3>Top Talkers</h3>
            <div id="topTalkersList"></div>
        </div>

        <div class="traffic-table">
            <div class="table-header">
                <div style="display: grid; grid-template-columns: 1fr 1fr 1fr 1fr 1fr 1fr; gap: 10px;">
                    <span>Timestamp</span>
                    <span>Source IP</span>
                    <span>Destination IP</span>
                    <span>Protocol</span>
                    <span>Size</span>
                    <span>Application</span>
                </div>
            </div>
            <div class="table-content" id="trafficTable"></div>
        </div>
    </div>

    <script>
        let ws;
        let trafficData = [];

        function connectWebSocket() {
            ws = new WebSocket('ws://localhost:8000/ws/packets');

            ws.onopen = function() {
                document.getElementById('status').textContent = 'Connected';
                document.getElementById('status').className = 'status connected';
                console.log('Connected to packet capture WebSocket');
            };

            ws.onmessage = function(event) {
                try {
                    const data = JSON.parse(event.data);

                    if (data.statistics) {
                        updateStatistics(data.statistics);
                    }

                    if (data.traffic) {
                        addTrafficRow(data.traffic);
                    }
                } catch (e) {
                    console.error('Error parsing WebSocket data:', e);
                }
            };

            ws.onclose = function() {
                document.getElementById('status').textContent = 'Disconnected';
                document.getElementById('status').className = 'status disconnected';
                console.log('WebSocket connection closed. Attempting to reconnect...');
                setTimeout(connectWebSocket, 3000);
            };

            ws.onerror = function(error) {
                console.error('WebSocket error:', error);
            };
        }

        function updateStatistics(stats) {
            document.getElementById('totalBandwidth').textContent = (stats.total_bandwidth_mb || 0).toFixed(2);
            document.getElementById('currentBandwidth').textContent = (stats.current_bandwidth_mbps || 0).toFixed(4);
            document.getElementById('totalConnections').textContent = stats.total_connections || 0;
            document.getElementById('activeConnections').textContent = stats.active_connections || 0;
            document.getElementById('networkHealth').textContent = Math.round(stats.network_health_score || 100);
            document.getElementById('peakBandwidth').textContent = (stats.peak_bandwidth_mb || 0).toFixed(4);

            // Update top talkers
            updateTopTalkers(stats.top_talkers || {});
        }

        function updateTopTalkers(topTalkers) {
            const container = document.getElementById('topTalkersList');
            container.innerHTML = '';

            const sortedTalkers = Object.entries(topTalkers)
                .sort(([,a], [,b]) => b - a)
                .slice(0, 10);

            sortedTalkers.forEach(([ip, bytes]) => {
                const item = document.createElement('div');
                item.className = 'talker-item';
                item.innerHTML = `
                    <span>${ip}</span>
                    <span>${formatBytes(bytes)}</span>
                `;
                container.appendChild(item);
            });
        }

        function addTrafficRow(traffic) {
            trafficData.unshift(traffic);
            if (trafficData.length > 100) {
                trafficData.pop();
            }

            const table = document.getElementById('trafficTable');
            const row = document.createElement('div');
            row.className = 'traffic-row';

            const protocol = traffic.protocol || 'Unknown';
            const protocolClass = protocol.toLowerCase().replace(/[^a-z]/g, '');

            row.innerHTML = `
                <span>${traffic.timestamp || ''}</span>
                <span>${traffic.src_ip || 'N/A'}</span>
                <span>${traffic.dst_ip || 'N/A'}</span>
                <span class="protocol-${protocolClass}">${protocol}</span>
                <span>${traffic.size || 0} bytes</span>
                <span>${traffic.application || 'Unknown'}</span>
            `;

            table.insertBefore(row, table.firstChild);

            // Keep only last 50 rows visible
            while (table.children.length > 50) {
                table.removeChild(table.lastChild);
            }
        }

        function formatBytes(bytes) {
            if (bytes === 0) return '0 B';
            const k = 1024;
            const sizes = ['B', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }

        // Connect to WebSocket when page loads
        connectWebSocket();
    </script>
</body>
</html>
